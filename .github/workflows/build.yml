name: Build MANCH APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install system packages
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython

      - name: Install pygame-ce Android recipe
        run: |
          mkdir -p .buildozer/android/platform/python-for-android/pythonforandroid/recipes/pygame-ce
          curl -L https://raw.githubusercontent.com/kivy/python-for-android/refs/pull/2971/head/pythonforandroid/recipes/pygame-ce/__init__.py \
            -o .buildozer/android/platform/python-for-android/pythonforandroid/recipes/pygame-ce/__init__.py

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MANCH-APK
          path: bin/*.apk
