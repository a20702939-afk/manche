name: Build MANCH APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool \
            libltdl-dev pkg-config \
            zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            libffi-dev libssl-dev \
            cmake

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer
          python -m pip install "cython==0.29.34"

      - name: Get python-for-android with pygame-ce
        run: |
          git clone --depth 1 --branch develop \
            https://github.com/kivy/python-for-android.git \
            p4a

      - name: Add pygame-ce recipe
        run: |
          mkdir -p recipes/pygame-ce
          cp p4a/pythonforandroid/recipes/pygame-ce/__init__.py \
             recipes/pygame-ce/__init__.py

      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MANCH-APK
          path: bin/*.apk
          if-no-files-found: error
