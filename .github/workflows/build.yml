name: Build MANCH APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool \
            libltdl-dev pkg-config \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev libffi-dev \
            libssl-dev cmake

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer
          python -m pip install "cython==0.29.34"

      - name: Download pygame-ce recipe
        run: |
          mkdir -p recipes/pygame-ce
          curl -L \
            https://raw.githubusercontent.com/kivy/python-for-android/a54e9af8dcb5616f361c74cd2fbc5cb4c7ae952b/pythonforandroid/recipes/pygame-ce/__init__.py \
            -o recipes/pygame-ce/__init__.py

      - name: Check recipe
        run: |
          test -s recipes/pygame-ce/__init__.py
          echo "pygame-ce recipe OK"

      - name: Clean
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MANCH-APK
          path: bin/*.apk
          if-no-files-found: error
